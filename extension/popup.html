<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 380px;
      min-height: 200px;
      max-height: 560px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #18181b;
      color: #e4e4e7;
      font-size: 13px;
      overflow-y: auto;
    }

    /* Top accent bar */
    .top-accent {
      height: 3px;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      flex-shrink: 0;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #27272a;
      position: sticky;
      top: 0;
      background: #18181b;
      z-index: 10;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-actions {
      display: flex;
      gap: 6px;
    }

    /* Buttons */
    .btn {
      padding: 6px 12px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: #3b82f6;
      color: #fff;
    }
    .btn-primary:hover { background: #60a5fa; }
    .btn-ghost {
      background: transparent;
      color: #a1a1aa;
      padding: 6px 8px;
    }
    .btn-ghost:hover { color: #fff; background: #27272a; }
    .btn-danger {
      background: transparent;
      color: #71717a;
      padding: 4px 6px;
      font-size: 11px;
    }
    .btn-danger:hover { color: #ef4444; }

    /* Tab bar */
    #tab-bar {
      display: flex;
      gap: 0;
      padding: 0 12px;
      background: #18181b;
      border-bottom: 1px solid #27272a;
      position: relative;
    }
    .tab-btn {
      background: transparent;
      color: #71717a;
      border: none;
      padding: 10px 16px 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.25s;
      position: relative;
    }
    .tab-btn:hover { color: #a1a1aa; }
    .tab-btn.active {
      color: #e4e4e7;
      border-bottom-color: #3b82f6;
    }

    /* View transitions */
    .view-fade {
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Setup screen */
    .setup {
      padding: 32px 20px;
      text-align: center;
    }
    .setup p {
      color: #a1a1aa;
      margin: 8px 0 20px;
      line-height: 1.5;
    }
    .setup input {
      width: 100%;
      padding: 10px 12px;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      outline: none;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    .setup input:focus { border-color: #3b82f6; }
    .setup .btn { width: 100%; padding: 10px; }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-top: 1px solid #27272a;
      margin-top: 20px;
    }
    .toggle-row label {
      font-size: 13px;
      color: #e4e4e7;
    }
    .toggle-row .sub {
      font-size: 11px;
      color: #71717a;
      margin-top: 2px;
    }
    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .toggle input { display: none; }
    .toggle .slider {
      position: absolute;
      inset: 0;
      background: #3f3f46;
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle .slider::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: transform 0.2s;
    }
    .toggle input:checked + .slider { background: #3b82f6; }
    .toggle input:checked + .slider::before { transform: translateX(18px); }
    .detail-recipient {
      padding: 0 16px 8px;
      font-size: 12px;
      color: #60a5fa;
    }

    /* Pixel list */
    .pixel-list {
      padding: 4px 0;
    }
    .pixel-item {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      margin: 0 8px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .pixel-item:hover {
      background: #27272a;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    .pixel-info { flex: 1; min-width: 0; }
    .pixel-id {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 13px;
      color: #fff;
      font-weight: 500;
    }
    .pixel-meta {
      font-size: 11px;
      color: #71717a;
      margin-top: 2px;
    }
    .pixel-recipient {
      font-size: 12px;
      color: #60a5fa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pixel-opens {
      font-size: 22px;
      font-weight: 700;
      margin-right: 12px;
      min-width: 32px;
      text-align: right;
      transition: color 0.2s;
    }
    .pixel-opens.has-opens { color: #22c55e; }
    .pixel-opens.no-opens { color: #3f3f46; }
    .pixel-actions {
      display: flex;
      gap: 2px;
      margin-left: 8px;
    }

    /* Sequence progress badge */
    .seq-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    /* Detail view */
    .detail {
      display: none;
    }
    .detail.active { display: block; animation: fadeIn 0.2s ease; }
    .detail-header {
      display: flex;
      align-items: center;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #27272a;
      gap: 10px;
      position: sticky;
      top: 0;
      background: #18181b;
      z-index: 10;
    }
    .detail-header h2 {
      font-size: 14px;
      font-weight: 600;
      flex: 1;
      font-family: monospace;
    }
    .stat-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 12px 16px;
    }
    .stat-card {
      background: #27272a;
      border-radius: 10px;
      padding: 12px;
      transition: background 0.2s;
    }
    .stat-card:hover { background: #3f3f46; }
    .stat-card label {
      font-size: 10px;
      text-transform: uppercase;
      color: #71717a;
      letter-spacing: 0.5px;
    }
    .stat-card .value {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-top: 4px;
    }
    .stat-card .value.green { color: #22c55e; }
    .stat-card .value.orange { color: #fb923c; }
    .stat-card .value.blue { color: #60a5fa; }

    /* Snippet box */
    .snippet-section {
      padding: 8px 16px 12px;
    }
    .snippet-label {
      font-size: 11px;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .snippet-box {
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 8px 10px;
      font-family: monospace;
      font-size: 11px;
      color: #a1a1aa;
      word-break: break-all;
      cursor: pointer;
      position: relative;
      transition: border-color 0.2s, background 0.2s;
    }
    .snippet-box:hover { border-color: #3b82f6; background: #3f3f46; }
    .snippet-box .copy-hint {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      font-size: 10px;
      color: #71717a;
      font-family: -apple-system, sans-serif;
    }

    /* Events list */
    .events-section {
      padding: 0 16px 16px;
    }
    .events-section h3 {
      font-size: 11px;
      text-transform: uppercase;
      color: #71717a;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .event-item {
      background: #27272a;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 4px;
      font-size: 11px;
      transition: background 0.15s;
    }
    .event-item:hover { background: #3f3f46; }
    .event-item .event-time {
      color: #60a5fa;
      font-weight: 500;
    }
    .event-item .event-detail {
      color: #71717a;
      margin-top: 2px;
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #71717a;
    }
    .empty p { margin-top: 8px; font-size: 12px; color: #a1a1aa; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #3b82f6;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      transition: transform 0.25s ease;
      z-index: 100;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* Loading / skeleton */
    .loading {
      text-align: center;
      padding: 40px;
      color: #71717a;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #27272a;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto 10px;
    }

    /* Skeleton pulse for loading states */
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .skeleton-row {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      gap: 12px;
    }
    .skeleton-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #27272a;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .skeleton-lines { flex: 1; }
    .skeleton-line {
      height: 10px;
      border-radius: 4px;
      background: #27272a;
      animation: pulse 1.5s ease-in-out infinite;
      margin-bottom: 6px;
    }
    .skeleton-line:last-child { margin-bottom: 0; width: 60%; }

    /* Timeline expand transition */
    .timeline-collapse {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.3s ease;
    }
    .timeline-collapse.expanded {
      max-height: 500px;
    }

    /* Settings branding footer */
    .settings-footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #27272a;
      text-align: center;
      color: #3f3f46;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <!-- Top accent bar -->
  <div class="top-accent"></div>

  <!-- Main List View -->
  <div id="list-view">
    <div class="header">
      <h1>&#9679; Mail Tracker</h1>
      <div class="header-actions">
        <button class="btn btn-ghost" id="dashboard-btn" title="Open Dashboard">&#8599;</button>
        <button class="btn btn-ghost" id="settings-btn" title="Settings">&#9881;</button>
        <button class="btn btn-primary" id="new-btn">+ Manual</button>
      </div>
    </div>
    <div id="tab-bar">
      <button class="tab-btn active" data-tab="list">Trackers</button>
      <button class="tab-btn" data-tab="sequences">Sequences</button>
      <button class="tab-btn" data-tab="templates">Templates</button>
    </div>
    <div id="pixel-container">
      <div class="loading"><div class="spinner"></div>Loading...</div>
    </div>
    <div id="sequences-view" style="display:none;padding:12px;"></div>
    <div id="templates-view" style="display:none;padding:12px;"></div>
  </div>

  <!-- Detail View -->
  <div id="detail-view" class="detail">
    <div class="detail-header">
      <button class="btn btn-ghost" id="back-btn">&#8592;</button>
      <h2 id="detail-id"></h2>
      <button class="btn btn-danger" id="delete-btn" title="Delete tracker">&#128465;</button>
    </div>
    <div class="detail-recipient" id="detail-recipient"></div>
    <div class="stat-cards">
      <div class="stat-card">
        <label>Real Opens</label>
        <div class="value green" id="detail-opens">0</div>
      </div>
      <div class="stat-card">
        <label>Last Open</label>
        <div class="value" id="detail-last" style="font-size:13px;">&#8212;</div>
      </div>
      <div class="stat-card">
        <label>Filtered</label>
        <div class="value orange" id="detail-skipped">0</div>
      </div>
      <div class="stat-card">
        <label>Sender Protection</label>
        <div class="value blue" id="detail-protection" style="font-size:13px;">&#8212;</div>
      </div>
    </div>
    <div class="snippet-section">
      <div class="snippet-label">HTML Snippet (click to copy)</div>
      <div class="snippet-box" id="snippet-html">
        <span class="copy-hint">click to copy</span>
      </div>
    </div>
    <div class="snippet-section">
      <div class="snippet-label">Tracking URL (click to copy)</div>
      <div class="snippet-box" id="snippet-url">
        <span class="copy-hint">click to copy</span>
      </div>
    </div>
    <div class="events-section">
      <h3>Recent Events</h3>
      <div id="events-list"></div>
    </div>
  </div>

  <!-- Setup View -->
  <div id="setup-view" style="display:none;">
    <div class="header">
      <h1>&#9881; Settings</h1>
      <button class="btn btn-ghost" id="setup-back-btn">&#8592;</button>
    </div>
    <div class="setup">
      <p>Enter your Mail Tracker server URL (your Cloudflare Worker URL)</p>
      <input type="url" id="server-input" placeholder="https://mail-tracker.yourname.workers.dev" />
      <input type="password" id="password-input" placeholder="Dashboard password (optional)" />
      <div id="oauth-status" style="margin-bottom:16px;padding:14px;background:#27272a;border-radius:10px;border:1px solid #3f3f46;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="color:#a1a1aa;font-size:13px;">Gmail API</span>
          <span id="oauth-indicator" style="font-size:12px;color:#71717a;padding:2px 8px;border-radius:20px;background:#3f3f46;">Checking...</span>
        </div>
        <button id="oauth-btn" style="margin-top:10px;background:#6366f1;color:white;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;width:100%;display:none;transition:background 0.2s,transform 0.15s;">Connect Gmail</button>
      </div>
      <button class="btn btn-primary" id="save-btn">Save & Connect</button>
      <p id="setup-error" style="color:#ef4444;margin-top:12px;display:none;"></p>
      <div class="toggle-row">
        <div>
          <label>Auto-track Gmail</label>
          <div class="sub">Auto-track when you Send in Gmail</div>
        </div>
        <label class="toggle" for="auto-track-toggle">
          <input type="checkbox" id="auto-track-toggle" checked />
          <span class="slider"></span>
        </label>
      </div>
      <div class="settings-footer">Mail Tracker v1.0</div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
